{% extends "base.html" %}
{% block title %}{{ ticket.title }} · Ghost Ticket{% endblock %}
{% block content %}
<article class="card">
  <p class="muted">Opened by {{ ticket.owner }}</p>
  <h1>{{ ticket.title }}</h1>
  <p class="body">{{ ticket.body }}</p>
  <p><a href="{{ url_for('dashboard') }}">Back to your tickets</a></p>
</article>
{% endblock %}
