<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ghost Ticket{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/">Ghost Ticket</a>
    <nav>
      {% if session.get('user') %}
        <span class="who">Signed in as <strong>{{ session['user'] }}</strong></span>
        <a href="{{ url_for('logout') }}">Log out</a>
      {% endif %}
    </nav>
  </header>
  <main class="wrap">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<p class="notice">{{ m }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
